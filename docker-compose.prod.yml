# Stack de production Dorloter (un seul fichier canonique).
# Nom de projet : COMPOSE_PROJECT_NAME (defini dans les scripts package.json) ;
# a defaut Docker utilise le nom du repertoire.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Topologie : Caddy (edge TLS) -> SPA Vite statique (web) + API (api) ;
# Postgres/PostGIS + MinIO (object storage images, expose en CDN).

services:
  # ─── Base de donnees ───────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-miaou}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env.production}
      POSTGRES_DB: miaou
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-miaou} -d miaou"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ─── Object storage (images) ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.production}
      MINIO_SERVER_URL: https://cdn.${DOMAIN:?set DOMAIN in .env.production}
      MINIO_BROWSER_REDIRECT_URL: https://console.${DOMAIN}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET:-miaou-photos};
      mc anonymous set download local/${S3_BUCKET:-miaou-photos};
      "
    restart: "no"
    networks: [internal]

  # ─── API (le service API) ───────────────────────────────────────────────
  # Mappe le schema dorloter_api existant et applique ses migrations SQL au
  # demarrage (DatabaseMigrator). Ecoute en interne, sans port publie.
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Role applicatif a privileges restreints (cf. scripts/init-db-roles.sql).
      # search_path dorloter_api,public : PostGIS vit dans public (partage).
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=miaou;Username=miaou_app;Password=${MIAOU_APP_PASSWORD:?set MIAOU_APP_PASSWORD};Search Path=dorloter_api,public"
      # Migrations DDL : role dedie (le superuser). Optionnel ; si absent,
      # AutoMigrate utilise la connexion Default.
      ConnectionStrings__Migrations: "Host=postgres;Port=5432;Database=miaou;Username=${POSTGRES_SUPERUSER:-miaou};Password=${POSTGRES_SUPERUSER_PASSWORD};Search Path=dorloter_api,public"
      Dorloter__Security__Jwt__Secret: "${API_JWT_SECRET:?set API_JWT_SECRET in .env.production}"
      Dorloter__Security__Jwt__Issuer: "dorloter-api"
      Dorloter__Security__Jwt__AccessTokenTtl: "00:15:00"
      Dorloter__Security__Jwt__RefreshTokenTtl: "30.00:00:00"
      Dorloter__Security__CorsAllowedOrigins: "https://${DOMAIN}"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # ─── Front SPA (Vite, statique) ────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # La SPA appelle l'API en same-origin (/api/v1) derriere Caddy : URL vide.
        VITE_API_URL: ""
        VITE_MAP_STYLE: ${VITE_MAP_STYLE:-}
    restart: unless-stopped
    networks: [internal]

  # ─── Reverse proxy + HTTPS auto (Let's Encrypt) ────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - minio
    networks: [internal]

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
