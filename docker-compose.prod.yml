# Stack de production Dorloter (un seul fichier canonique).
# Nom de projet : COMPOSE_PROJECT_NAME (defini dans les scripts package.json) ;
# a defaut Docker utilise le nom du repertoire.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Topologie : Caddy (edge TLS) -> SPA Vite statiques (web, pro) + API NestJS (api) ;
# Postgres/PostGIS + MinIO (object storage images, expose en CDN).

services:
  # ─── Base de donnees ───────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-dorloter}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env.production}
      POSTGRES_DB: dorloter
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-dorloter} -d dorloter"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ─── Object storage (images) ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.production}
      MINIO_SERVER_URL: https://cdn.${DOMAIN:?set DOMAIN in .env.production}
      MINIO_BROWSER_REDIRECT_URL: https://console.${DOMAIN}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET:-dorloter-photos};
      mc anonymous set download local/${S3_BUCKET:-dorloter-photos};
      "
    restart: "no"
    networks: [internal]

  # ─── API NestJS ────────────────────────────────────────────────────────────
  # Mappe le schema dorloter_api existant et applique ses migrations SQL au
  # demarrage (migrateur maison). Ecoute en interne, sans port publie.
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Role applicatif a privileges restreints (cf. scripts/init-db-roles.sql).
      # search_path dorloter_api,public : PostGIS vit dans public (partage).
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=dorloter;Username=dorloter_app;Password=${DORLOTER_APP_PASSWORD:?set DORLOTER_APP_PASSWORD};Search Path=dorloter_api,public"
      # Migrations DDL : role dedie (le superuser). Optionnel ; si absent,
      # le migrateur utilise la connexion Default.
      ConnectionStrings__Migrations: "Host=postgres;Port=5432;Database=dorloter;Username=${POSTGRES_SUPERUSER:-dorloter};Password=${POSTGRES_SUPERUSER_PASSWORD};Search Path=dorloter_api,public"
      Dorloter__Security__Jwt__Secret: "${API_JWT_SECRET:?set API_JWT_SECRET in .env.production}"
      Dorloter__Security__Jwt__Issuer: "dorloter-api"
      Dorloter__Security__CorsAllowedOrigins: "https://${DOMAIN},https://pro.${DOMAIN}"
      BIND_ADDR: "0.0.0.0:8080"
      # URL publique, utilisee dans les liens des emails transactionnels.
      Dorloter__PublicWebUrl: "https://${DOMAIN}"
      # SMTP transactionnel. EMAIL_SMTP_HOST vide = envoi desactive (emails
      # seulement loggues) ; dans ce cas la relance avant suppression d'un
      # compte inactif ne part pas, et aucun compte n'est supprime.
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST:-}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-587}"
      EMAIL_SMTP_USER: "${EMAIL_SMTP_USER:-}"
      EMAIL_SMTP_PASSWORD: "${EMAIL_SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-no-reply@${DOMAIN}}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-Dorloter}"
      # Stockage objet. S3_ENDPOINT doit etre l'URL PUBLIQUE de MinIO : elle
      # entre dans la signature des URL d'upload, et c'est l'hote que le
      # navigateur contactera. MINIO_SERVER_URL (service minio) vaut la meme.
      S3_ENDPOINT: "https://cdn.${DOMAIN}"
      S3_BUCKET: "${S3_BUCKET:-dorloter-photos}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # ─── Front SPA public (Vite, statique) · vitrine adoptants ─────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # La SPA appelle l'API en same-origin (/api/v1) derriere Caddy : URL vide.
        VITE_API_URL: ""
        VITE_MAP_STYLE: ${VITE_MAP_STYLE:-}
        # Lien « espace pro » du navbar vers le sous-domaine pro.
        VITE_PRO_URL: https://pro.${DOMAIN}
    restart: unless-stopped
    networks: [internal]

  # ─── Front SPA espace pro (Vite, statique) · consoles refuge/pension/veto ──
  pro:
    build:
      context: .
      dockerfile: apps/pro/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    networks: [internal]

  # ─── Reverse proxy + HTTPS auto (Let's Encrypt) ────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Journaux d'acces (contiennent des IP) : purges au bout de 12 mois par
      # Caddy lui-meme, cf. les directives `log` du Caddyfile.
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
      - web
      - pro
      - minio
    networks: [internal]

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  internal:
    driver: bridge
