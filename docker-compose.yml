# Stack de dev : Postgres/PostGIS + MinIO. Nom de projet figé pour des noms de
# conteneurs stables (dorloter-postgres-1, etc.), independamment du dossier.
name: dorloter

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: dorloter
      POSTGRES_PASSWORD: dorloter
      POSTGRES_DB: dorloter
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/dorloter-photos --ignore-existing;
      mc anonymous set download local/dorloter-photos;
      "

volumes:
  pgdata:
  miniodata:
