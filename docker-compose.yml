# Stack de dev : Postgres/PostGIS + MinIO. Nom de projet figé pour des noms de
# conteneurs stables (dorloter-postgres-1, etc.), independamment du dossier.
name: dorloter

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: dorloter
      POSTGRES_PASSWORD: dorloter
      POSTGRES_DB: dorloter
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # API NestJS. Opt-in via le profil "api" : `docker compose --profile api up`.
  # En dev on lance plutôt l'API en local (bun dev) ; ce service sert au test
  # d'intégration de l'image et au déploiement.
  api:
    profiles: ["api"]
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=dorloter;Username=dorloter;Password=dorloter;Search Path=dorloter_api,public"
      Dorloter__Security__Jwt__Secret: "dev-only-insecure-secret-please-change-0123456789abcdef"
      Dorloter__Security__CorsAllowedOrigins: "http://localhost:5173,http://localhost:5174"
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/dorloter-photos --ignore-existing;
      mc anonymous set download local/dorloter-photos;
      "

volumes:
  pgdata:
  miniodata:
