name: A11y (Playwright + axe-core)

# Audits axe-core sur les pages publiques. Ne tourne pas dans la CI standard
# parce qu'on a besoin d'une instance lancée (DB + serveur). On audite donc
# soit la prod, soit un environnement spécifié manuellement.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de base à auditer (sans trailing slash)"
        required: false
        default: "https://dorloter.fr"
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: false

jobs:
  axe:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'failure' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx --bun playwright install --with-deps chromium

      - name: Compute base URL
        id: base
        run: |
          BASE="${{ github.event.inputs.base_url }}"
          if [ -z "$BASE" ]; then BASE="https://dorloter.fr"; fi
          echo "url=$BASE" >> "$GITHUB_OUTPUT"

      - name: Run a11y tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.base.outputs.url }}
        run: bun run test:a11y -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
