name: API CI 

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up NestJS 10
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Restore
        run: bun run restore

      - name: Build
        run: bun run build --no-restore -c Release

      # Les tests d'integration utilisent Testcontainers : un conteneur PostgreSQL/PostGIS
      # ephemere ou sont appliquees les memes migrations Flyway que l'API. Docker est
      # disponible nativement sur les runners ubuntu-latest.
      - name: Test (Testcontainers PostGIS)
        run: bun run test --no-build -c Release --logger "console;verbosity=normal"

  # Valide que l'image de prod build proprement (MCR joignable en CI). Pas de push :
  # le deploiement build l'image sur le VPS depuis la source (cf. scripts/deploy.sh).
  docker-build:
    name: Docker image (build, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
