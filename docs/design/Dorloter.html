<style>
  /* ===== DORLOTER · « La Gazette » — refonte éditoriale ================= */
  /* Variables conservées (coral/lavande/sable/prune) mais repensées :       */
  /* coral → VERT BOUTEILLE · lavande → AMBRE · sable → PAPIER · prune → ENCRE */
  :root {
    /* Vert bouteille · primaire */
    --coral-50:#eef4ef; --coral-100:#d6e7dc; --coral-200:#aecfba; --coral-300:#7db295;
    --coral-400:#4c9270; --coral-500:#1f6f4f; --coral-600:#185a40; --coral-700:#144734;
    --coral-800:#113a2b; --coral-900:#0d2b20;
    /* Ambre · accent */
    --lavande-50:#fbf2df; --lavande-100:#f6e4bd; --lavande-200:#edcd86; --lavande-300:#e3b552;
    --lavande-400:#d59e2c; --lavande-500:#bf8718; --lavande-600:#9c6c14; --lavande-700:#785212;
    --lavande-800:#553a0f; --lavande-900:#39270b;
    /* Papier · neutres chauds */
    --sable-50:#faf7f0; --sable-100:#f3ede1; --sable-200:#e6dcc8; --sable-300:#d6c8ab;
    --sable-400:#bdaa87; --sable-500:#9d8a67; --sable-600:#7c6c50; --sable-700:#5f5340;
    --sable-800:#473e30; --sable-900:#332c22;
    /* Encre forêt · profondeur (slabs, footer, CTA) */
    --prune-50:#eef2ee; --prune-100:#d8e1d9; --prune-200:#b0c2b3; --prune-300:#7e9a84;
    --prune-400:#4e6e57; --prune-500:#2f4d3a; --prune-600:#22392b; --prune-700:#1a2c22;
    --prune-800:#13201a; --prune-900:#0c1610;
    /* Terracotta · sémantique négative / perdu / urgent */
    --brick-50:#fbeee9; --brick-100:#f6d7cc; --brick-200:#eab3a1; --brick-300:#dd8a70;
    --brick-400:#cf6543; --brick-500:#b5482f; --brick-600:#963829; --brick-700:#742c20;
    --brick-800:#522017; --brick-900:#371610;
    /* Sémantiques (light) */
    --background:#f3ede1; --foreground:#23201a; --card:#fbf8f1; --card-fg:#23201a;
    --primary:#1f6f4f; --primary-fg:#fbf8f1; --muted:#ece4d4; --muted-fg:#7c6c50;
    --border:#e0d7c4; --ring:#1f6f4f;
    --radius:0.25rem;
    --tint-coral:#eaf1ec; --tint-lavande:#fbf2df; --tint-prune:#eef2ee;
    --font-display:'Newsreader', Georgia, 'Times New Roman', serif;
    --font-body:'Hanken Grotesk', system-ui, sans-serif;
  }
  .dark {
    --background:#141611; --foreground:#efe9da; --card:#1d211a; --card-fg:#efe9da;
    --primary:#5aa67e; --primary-fg:#0c1610; --muted:#262a20; --muted-fg:#a89c83;
    --border:#343a2c; --ring:#5aa67e;
    /* primaire/accent ré-éclaircis pour rester lisibles sur fond sombre */
    --coral-300:#7db295; --coral-400:#57a07a; --coral-500:#6fbb91; --coral-600:#8fcdaa;
    --lavande-400:#e3b552; --lavande-500:#e3b552; --lavande-600:#edcd86;
    --sable-100:#1d211a; --sable-200:#343a2c; --sable-300:#3f4636;
    --tint-coral:#16241c; --tint-lavande:#2a2212; --tint-prune:#101a13;
    --brick-50:#2e1812; --brick-300:#a85a42; --brick-500:#d4795f; --brick-600:#e09a85; --brick-700:#eab3a1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: var(--font-body); }
  body {
    background: var(--background); color: var(--foreground);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  /* Titres en serif éditorial — toujours actifs (cœur de la nouvelle identité) */
  h1, h2, h3, .brandword { font-family: var(--font-display); font-weight: 600; }
  ::selection { background: var(--lavande-200); color: var(--prune-900); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-thumb { background: var(--sable-300); border-radius: 0; border: 3px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--sable-400); background-clip: padding-box; }
  .tabular { font-variant-numeric: tabular-nums; }
  .mono { font-family: 'Geist Mono', monospace; }
  .serif-i { font-family: var(--font-display); font-style: italic; }
  .lead-drop::first-letter { font-family: var(--font-display); font-weight: 700; font-size: 3.3em;
    float: left; line-height: .78; padding: 6px 10px 0 0; color: var(--coral-600); }
  /* ===== Fioritures éditoriales (toggle .ident-bold sur <html>) ========= */
  html:not(.ident-bold) .ident-only { display: none !important; }
  .np-scroll::-webkit-scrollbar { height: 0; width: 0; display: none; }
  .np-scroll { scrollbar-width: none; }
  @media (max-width: 860px) { .np-hide { display: none !important; } }
  @keyframes dlMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes dlStampIn { from { opacity:0; transform: rotate(-14deg) scale(.6); } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
  }
</style>
